<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机传文件</title><link rel="stylesheet" href="../assets/common.css"></head><body><nav class="site-nav"><div class="site-nav-inner"><a class="site-brand" href="../">Tools</a><a class="active" href="./">手机传文件</a></div></nav><div class="page-wrap"><main><h1>手机传文件</h1><p class="desc">需要先在电脑上运行本地接收服务，然后打开电脑端页面生成二维码。</p><ol><li>在仓库根目录执行 <code>npm install</code>。</li><li>执行 <code>npm run start:phone-transfer</code>。</li><li>打开 <code>http://localhost:8787/desktop.html</code>。</li></ol><p class="desc">手机和电脑连接同一 Wi‑Fi 后扫码即可上传，文件默认保存到电脑桌面。</p></main></div></body></html>
