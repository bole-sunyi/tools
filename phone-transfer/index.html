<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机传文件</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    .launch-card { margin-top: 24px; padding: 24px; border: 1px solid #dbeafe; border-radius: 16px; background: #eff6ff; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
    .action { display: inline-block; padding: 12px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    .action.primary { color: #fff; background: #2563eb; }
    .action.secondary { color: #1d4ed8; background: #fff; border: 1px solid #93c5fd; }
    .system { font-weight: 700; color: #1d4ed8; }
    .steps { line-height: 1.9; padding-left: 22px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <nav class="site-nav"><div class="site-nav-inner"><a class="site-brand" href="../">Tools</a><a class="active" href="./">手机传文件</a></div></nav>
  <div class="page-wrap"><main>
    <h1>手机传文件</h1>
    <p class="desc">电脑启动本地服务后生成二维码，手机扫码即可把照片、视频、文档等文件传到电脑桌面。</p>
    <section class="launch-card">
      <p>检测到当前设备：<span id="system" class="system">正在识别…</span></p>
      <div class="actions">
        <a id="mac" class="action primary hidden" href="../start-phone-transfer.command" download>下载 macOS 启动脚本</a>
        <a id="win" class="action primary hidden" href="../start-phone-transfer.bat" download>下载 Windows 启动脚本</a>
        <a class="action secondary" href="http://localhost:8787/desktop.html">本地服务已启动，打开二维码</a>
      </div>
      <ol class="steps">
        <li>下载当前系统对应的启动脚本，并放到 <code>tools</code> 仓库根目录。</li>
        <li><span id="instruction">双击启动脚本</span>，首次运行会自动安装依赖。</li>
        <li>浏览器会自动打开二维码页面；手机与电脑需连接同一 Wi‑Fi。</li>
      </ol>
      <p class="desc">受浏览器安全限制，在线网页不能直接运行电脑上的本地程序，因此首次需要手动运行一次启动脚本。</p>
    </section>
  </main></div>
  <script>
    const value = `${navigator.userAgentData?.platform || ''} ${navigator.platform || ''} ${navigator.userAgent}`.toLowerCase();
    const isWindows = value.includes('win');
    const isMac = value.includes('mac');
    const system = document.getElementById('system');
    const instruction = document.getElementById('instruction');
    if (isWindows) {
      system.textContent = 'Windows';
      document.getElementById('win').classList.remove('hidden');
      instruction.textContent = '双击 start-phone-transfer.bat';
    } else if (isMac) {
      system.textContent = 'macOS';
      document.getElementById('mac').classList.remove('hidden');
      instruction.textContent = '双击 start-phone-transfer.command；如果被拦截，请右键选择“打开”';
    } else {
      system.textContent = '其他系统';
      document.getElementById('mac').classList.remove('hidden');
      document.getElementById('win').classList.remove('hidden');
    }
  </script>
</body>
</html>
