<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传文件</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>上传到电脑</h1><p class="muted">文件将保存到电脑桌面，支持照片、视频、文档和其他格式。</p><form id="form"><input id="files" name="files" type="file" multiple><button>选择并上传</button></form><p id="status"></p></main><script>const token=new URLSearchParams(location.search).get('token'),form=document.getElementById('form'),input=document.getElementById('files'),status=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();if(!token||!input.files.length){status.textContent='请先选择文件';return}status.textContent='正在上传…';const r=await fetch('/api/upload/'+encodeURIComponent(token),{method:'POST',body:new FormData(form)});const d=await r.json();status.textContent=r.ok?'上传完成：'+d.files.length+' 个文件已保存到电脑桌面':(d.error||'上传失败');if(r.ok)input.value=''}</script></body></html>
