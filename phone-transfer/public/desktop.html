<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机传文件 · 电脑端</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>手机传文件</h1><p class="muted">每次生成一个临时二维码，手机扫码后选择任意文件上传。</p><button id="new">生成二维码</button><section id="panel" hidden><img id="qr" alt="上传二维码"><p>手机与电脑连接同一 Wi‑Fi 后扫码</p><code id="url"></code><h2>已接收文件</h2><ul id="files"><li class="muted">等待上传…</li></ul></section></main><script>const $=id=>document.getElementById(id);let token;async function create(){const r=await fetch('/api/session');const d=await r.json();token=d.token;$("qr").src='/api/qr?text='+encodeURIComponent(d.uploadUrl);$("url").textContent=d.uploadUrl;$("panel").hidden=false;poll()}async function poll(){if(!token)return;const r=await fetch('/api/session/'+token);if(!r.ok)return;const d=await r.json();$("files").innerHTML=d.files.length?d.files.slice().reverse().map(f=>'<li>'+esc(f.name)+' <small>'+fmt(f.size)+'</small></li>').join(''):'<li class="muted">等待上传…</li>';setTimeout(poll,1500)}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'}$("new").onclick=create;</script></body></html>
