<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tools</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    .tool-list {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    .tool-card {
      display: block;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .tool-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
      transform: translateY(-1px);
    }

    .tool-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #1d4ed8;
    }

    .tool-card p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-brand" href="./">Tools</a>
      <a href="./mod-calculator/">Mod 取模计算器</a>
      <a href="./game-time-converter/">游戏时间转换</a>
    </div>
  </nav>

  <div class="page-wrap">
    <main>
      <h1>工具集</h1>
      <p class="desc">常用小工具集合，点击卡片进入对应工具页面。</p>

      <div class="tool-list">
        <a class="tool-card" href="./mod-calculator/">
          <h2>Mod 取模计算器</h2>
          <p>计算 <code>(第一个数 % 第二个数) % 第三个数</code>，支持大整数。</p>
        </a>
        <a class="tool-card" href="./game-time-converter/">
          <h2>游戏时间转换</h2>
          <p>输入北京时间，换算 CF / MT 的跨天服时间（夏令时 9 点跨天 / 下午 6 点跨天）与正式服时间。</p>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
