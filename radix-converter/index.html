<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>进制转换</title>
  <link rel="stylesheet" href="../assets/common.css">
  <style>
    .input-row {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 640px) {
      .input-row {
        grid-template-columns: 1fr;
      }
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .result-grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .result-item {
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .result-item.active {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .result-base {
      font-size: 14px;
      font-weight: 700;
      color: #1d4ed8;
    }

    .copy-btn {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #d1d5db;
      color: #374151;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #f3f4f6;
    }

    .result-value {
      font-size: 20px;
      font-weight: 800;
      word-break: break-all;
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .error {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fef2f2;
      color: #dc2626;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .hint {
      margin-top: 16px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-brand" href="../">Tools</a>
      <a href="../mod-calculator/">Mod 取模</a>
      <a href="../game-time-converter/">游戏时间</a>
      <a href="../timestamp-converter/">时间戳</a>
      <a href="../radix-converter/" class="active">进制转换</a>
    </div>
  </nav>

  <div class="page-wrap">
    <main>
      <h1>进制转换</h1>
      <p class="desc">在 2、8、10、16、32 进制之间互相转换。输入任意进制的数值，自动换算为其他进制。</p>

      <div class="input-row">
        <div>
          <label for="valueInput">输入数值</label>
          <input id="valueInput" autocomplete="off" spellcheck="false" placeholder="例如 FF、1010、377">
        </div>
        <div>
          <label for="baseSelect">输入进制</label>
          <select id="baseSelect">
            <option value="2">2 进制</option>
            <option value="8">8 进制</option>
            <option value="10" selected>10 进制</option>
            <option value="16">16 进制</option>
            <option value="32">32 进制</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="secondary" type="button" data-example="255|10">示例 255</button>
        <button class="secondary" type="button" data-example="FF|16">示例 0xFF</button>
        <button class="secondary" type="button" data-example="1010|2">示例 1010₂</button>
        <button class="secondary" type="button" id="clearBtn">清空</button>
      </div>

      <div id="errorBox" class="error hidden" role="alert"></div>

      <div class="result-grid" id="resultGrid">
        <div class="result-item" data-base="2">
          <div class="result-head">
            <span class="result-base">2 进制</span>
            <button class="copy-btn" type="button" data-copy="2">复制</button>
          </div>
          <div class="result-value" id="out2">—</div>
        </div>
        <div class="result-item" data-base="8">
          <div class="result-head">
            <span class="result-base">8 进制</span>
            <button class="copy-btn" type="button" data-copy="8">复制</button>
          </div>
          <div class="result-value" id="out8">—</div>
        </div>
        <div class="result-item" data-base="10">
          <div class="result-head">
            <span class="result-base">10 进制</span>
            <button class="copy-btn" type="button" data-copy="10">复制</button>
          </div>
          <div class="result-value" id="out10">—</div>
        </div>
        <div class="result-item" data-base="16">
          <div class="result-head">
            <span class="result-base">16 进制</span>
            <button class="copy-btn" type="button" data-copy="16">复制</button>
          </div>
          <div class="result-value" id="out16">—</div>
        </div>
        <div class="result-item" data-base="32">
          <div class="result-head">
            <span class="result-base">32 进制</span>
            <button class="copy-btn" type="button" data-copy="32">复制</button>
          </div>
          <div class="result-value" id="out32">—</div>
        </div>
      </div>

      <p class="hint">
        16 进制与 32 进制支持 <code>0-9</code> 和 <code>A-Z</code>（32 进制用到 <code>A-V</code>），不区分大小写。
        支持负整数；32 进制输出使用大写字母。
      </p>
    </main>
  </div>

  <script>
    const BASES = [2, 8, 10, 16, 32];
    const DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUV";

    const valueInput = document.getElementById("valueInput");
    const baseSelect = document.getElementById("baseSelect");
    const errorBox = document.getElementById("errorBox");
    const resultGrid = document.getElementById("resultGrid");

    function normalizeInput(raw, base) {
      let value = raw.trim();
      if (!value) {
        throw new Error("请输入数值");
      }

      let sign = "";
      if (value.startsWith("-")) {
        sign = "-";
        value = value.slice(1);
      } else if (value.startsWith("+")) {
        value = value.slice(1);
      }

      value = value.replace(/\s+/g, "");
      if (base === 16 && /^0x/i.test(value)) {
        value = value.slice(2);
      }
      if (base === 2 && /^0b/i.test(value)) {
        value = value.slice(2);
      }
      if (base === 8 && /^0o/i.test(value)) {
        value = value.slice(2);
      }

      if (!value) {
        throw new Error("请输入有效数值");
      }

      const upper = value.toUpperCase();
      const maxDigit = base - 1;
      for (const ch of upper) {
        const digit = DIGITS.indexOf(ch);
        if (digit < 0 || digit > maxDigit) {
          throw new Error(`包含非法字符「${ch}」，不符合 ${base} 进制`);
        }
      }

      return sign + upper;
    }

    function parseToBigInt(raw, base) {
      const normalized = normalizeInput(raw, base);
      if (normalized === "-") {
        throw new Error("请输入有效数值");
      }
      const negative = normalized.startsWith("-");
      const digits = negative ? normalized.slice(1) : normalized;
      const value = BigInt(digits, base);
      return negative ? -value : value;
    }

    function toBaseString(value, base) {
      if (value === 0n) {
        return "0";
      }

      const negative = value < 0n;
      let n = negative ? -value : value;
      let output = "";

      while (n > 0n) {
        const remainder = Number(n % BigInt(base));
        output = DIGITS[remainder] + output;
        n /= BigInt(base);
      }

      return negative ? `-${output}` : output;
    }

    function convert() {
      try {
        const inputBase = Number(baseSelect.value);
        const number = parseToBigInt(valueInput.value, inputBase);

        hideError();
        for (const base of BASES) {
          document.getElementById(`out${base}`).textContent = toBaseString(number, base);
        }

        resultGrid.querySelectorAll(".result-item").forEach((item) => {
          item.classList.toggle("active", Number(item.dataset.base) === inputBase);
        });
      } catch (error) {
        showError(error.message || String(error));
        for (const base of BASES) {
          document.getElementById(`out${base}`).textContent = "—";
        }
        resultGrid.querySelectorAll(".result-item").forEach((item) => {
          item.classList.remove("active");
        });
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.classList.add("hidden");
      errorBox.textContent = "";
    }

    async function copyValue(base) {
      const text = document.getElementById(`out${base}`).textContent;
      if (!text || text === "—") {
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // Clipboard may be unavailable in non-secure contexts.
      }
    }

    valueInput.addEventListener("input", convert);
    baseSelect.addEventListener("change", convert);

    document.querySelectorAll("[data-example]").forEach((button) => {
      button.addEventListener("click", () => {
        const [value, base] = button.dataset.example.split("|");
        valueInput.value = value;
        baseSelect.value = base;
        convert();
      });
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      valueInput.value = "";
      hideError();
      for (const base of BASES) {
        document.getElementById(`out${base}`).textContent = "—";
      }
      resultGrid.querySelectorAll(".result-item").forEach((item) => {
        item.classList.remove("active");
      });
      valueInput.focus();
    });

    resultGrid.querySelectorAll(".copy-btn").forEach((button) => {
      button.addEventListener("click", () => copyValue(button.dataset.copy));
    });

    valueInput.value = "255";
    convert();
  </script>
</body>
</html>
